# Builds Sonix for MPC in GitHub Actions and attaches Sonix-<version>-mpc-armv7.zip to a DRAFT release. The packed
# instruments come from an earlier release zip with the same library version (tools/ci_build.sh).
# Actions -> Release -> Run workflow, enter the version. Install that zip on an MPC, check it, then publish the draft.
# Release notes: write docs/releases/v<version>.md first -- what changed and what was fixed since the last release (not
# install steps; those are in INSTALL.md inside the zip). The draft's notes are that file.
# mpc-vst-plugins is pinned in both places below: the workflow (3dthc fork, notes from docs/releases) and its tools.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.3.10
        required: true
        type: string
      dry_run:
        description: Build and package only (zip and page previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: 3dthc/mpc-vst-plugins/.github/workflows/vst-release.yml@c2f5abf7ab537a5d1006262ac7ec47a7b37ac537
    permissions: { contents: write }
    with:
      tag: v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: c6b4bb0b4939bbf64e2017bd3c11d95a080799f9
      user_data: user          # the shared favourites (user/favorites.txt): an upgrade keeps them
      vst_dir: vst
      build: bash tools/ci_build.sh
      host_test: 'mkdir -p vst/build/engine && cp engine/* vst/build/engine/ && "$MPC_VST/tools/test_port.sh" vst/vst.json'
      extra: engine:engine
      about: A ROMpler with 128 presets and 45 instruments - pianos, keys, guitars, strings, brass, choirs, pads, synths, leads, plucks, bass and bells, from CC0 / CC BY recordings and original renders. Four layers, filter, LFO, chorus, delay, reverb, eleven colorways.
      plugin_id: sonix
      license: MIT
      dry_run: ${{ inputs.dry_run }}
